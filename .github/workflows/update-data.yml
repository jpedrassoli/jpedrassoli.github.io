name: Update publications and news

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "*_manual.json"
      - "update_data.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json publications.js news.json news.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update publications and news [skip ci]"
            git push
          fi
